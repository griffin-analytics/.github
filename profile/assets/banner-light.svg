<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Griffin Analytics. Methodology and Technology for quantitative marketing.">
  <defs>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#D81B60"/>
      <stop offset="0.55" stop-color="#C2185B"/>
      <stop offset="1" stop-color="#7B1FA2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#D81B60" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#7B1FA2" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FBFAF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D81B60"/>
      <stop offset="1" stop-color="#7B1FA2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="#FBFAF8"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- abstract wing, rising strokes -->
  <g fill="none" stroke="url(#accent)" stroke-linecap="round">
    <path d="M 880 268 C 1000 252 1110 196 1216 62" stroke-width="2.5" opacity="0.9"/>
    <path d="M 908 274 C 1020 260 1122 212 1226 96" stroke-width="2" opacity="0.7"/>
    <path d="M 938 279 C 1042 268 1134 228 1234 130" stroke-width="1.6" opacity="0.55"/>
    <path d="M 970 283 C 1064 275 1146 244 1240 164" stroke-width="1.3" opacity="0.4"/>
    <path d="M 1004 286 C 1088 281 1158 259 1244 198" stroke-width="1" opacity="0.28"/>
    <path d="M 1040 288 C 1112 286 1170 273 1246 230" stroke-width="0.8" opacity="0.18"/>
  </g>
  <circle cx="1216" cy="62" r="3.5" fill="#D81B60"/>
  <circle cx="1226" cy="96" r="2.5" fill="#C2185B" opacity="0.7"/>
  <circle cx="1234" cy="130" r="2" fill="#AD1457" opacity="0.5"/>

  <!-- rule -->
  <rect x="84" y="96" width="150" height="2" fill="url(#rule)"/>

  <!-- wordmark -->
  <text x="82" y="172" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="14" fill="#17141A">GRIFFIN</text>
  <text x="82" y="216" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="17.4" fill="url(#accent)">ANALYTICS</text>

  <!-- tagline -->
  <text x="84" y="262" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="3.2" fill="#6E6A75">METHODOLOGY AND TECHNOLOGY FOR QUANTITATIVE MARKETING</text>
</svg>